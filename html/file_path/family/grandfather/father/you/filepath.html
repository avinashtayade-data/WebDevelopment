<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filepath</title>
</head>
<body>
    <!-- Absolute File path -->
    <h1 style="text-align: center;">Absolutefilepath</h1>
    <div style="width: 100%;height: 225px;background-color: lightgray;">
     <img style="height: 100%;width:250px;"   src="C:\WebDevelopment\html\file_path\family\family photo.jpeg" alt="">
     <img style="height: 100%;width:250px;"   src="C:\WebDevelopment\html\file_path\family\grandfather\grandfather.jpeg" alt="">
     <img style="height: 100%;width:250px;"   src="C:\WebDevelopment\html\file_path\family\grandfather\father\father.jpeg" alt="">
     <img style="height: 100%;width:250px;"   src="C:\WebDevelopment\html\file_path\family\grandfather\father\you\me.jpeg" alt="">
     <img style="height: 100%;width:250px;"   src="C:\WebDevelopment\html\file_path\family\grandfather\father\you\my child.jpeg" alt="">
     <img style="height: 100%;width:250px;"   src="C:\WebDevelopment\html\file_path\family\grandfather\father\you\grand child.jpeg" alt="">
    </div>
    <!-- Relative File path -->
    <h1 style="text-align: center;">Relative File path</h1>
    <div style="width: 100%;height: 225px;background-color: lightgray;">
        <img style="width: 247.46px;height: 100%;" src="../../../family photo.jpeg" alt="">
        <img style="width: 247.46px;height: 100%;" src="../../grandfather.jpeg" alt="">
        <img style="width: 247.46px;height: 100%;" src="../father.jpeg" alt="">
        <img style="width: 247.46px;height: 100%;" src="me.jpeg" alt="">
        <img style="width: 247.46px;height: 100%;" src="my child.jpeg" alt="">
        <img style="width: 247.46px;height: 100%;" src="grand child.jpeg" alt="">

    </div>
</body>
</html>
