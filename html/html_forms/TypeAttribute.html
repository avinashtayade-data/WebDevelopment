<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeAttribute</title>
</head>
<body style="font-size: 20px;font-family: sans-serif;">
    <form action="">
        <!-- Table inside form -->
    <table>
        <!-- Html form table body rows -->
        <tbody>
            <!-- html form body rows -->
             <!-- first rows -->
            <tr>
                <td><label for="">Username</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="text"></td>
            </tr>
            <!-- Second row -->
            <tr>
                <td><label for="">Password</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="password"></td>
            </tr>
            <!-- Third row -->
            <tr>
                <td><label for="">EmailUsername</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="email"></td>
            </tr>
            <!-- Fourth row -->
            <tr>
                <td><label for="">Age</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="number"></td>
            </tr>
            <!-- Fifth row -->
             <tr>
                <td><label for="">MobileNumber</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="tel"></td>
            </tr>
            <!-- Sixth row -->
             <tr>
                <td><label for="">ChooseColor</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="color"></td>
            </tr>
            <!-- Seventh row -->
            <tr>
                <td><label for="">Brightness</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="range"></td>
            </tr>
            <!-- Eight row -->
            <tr>
                <td><label for="">Pickdate</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="date"></td>
            </tr>
            <!-- Ninth row -->
            <tr>
                <td><label for="">PickTime</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="time"></td>
            </tr>
            <!-- Tenth row -->
            <tr>
                <td><label for="">PickWeek</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="week"></td>
            </tr>
            <!-- Eleventh row -->
            <tr>
                <td><label for="">YearofPassedOut</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="month"></td>
            </tr>
            <!-- Twelveth row -->
            <tr>
                <td><label for="">PickDateTime</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="datetime"></td>
            </tr>
            <!-- Thirtheen row -->
            <tr>
                <td><label for="">Search</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="search"></td>
            </tr>
            <!-- Fourtheenth row -->
            <tr>
                <td><label for="">uploadSongRecording</label></td>
                <td><input style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;" type="file"></td>
            </tr>
            <!-- Fiftheenth row -->
            <tr>
                <td><label for="">Gender</label></td>
                <td>
                    <input type="radio" name="Gender" style="width: 15px;height: 15px;"  id=""><span>Male</span>
                    <input type="radio" name="Gender" style="width: 15px;height: 15px;"  id=""><span>FeMale</span>
                    <input type="radio" name="Gender" style="width: 15px;height: 15px;"  id=""><span>TransGender</span>
                    <input type="radio" name="Gender" style="width: 15px;height: 15px;"  id=""><span>TransWomen</span>
                </td>
            </tr>
            <!-- Sixtheen row -->
             <tr>
                <td><label for="">Skillset</label></td>
                <td>
                    <input type="checkbox" name="skillset" style="height: 15px;width: 15px;" id=""><span>HTML</span>
                    <input type="checkbox" name="skillset" style="height: 15px;width: 15px;" id=""><span>Css</span>
                    <input type="checkbox" name="skillset" style="height: 15px;width: 15px;" id=""><span>JavaScript</span>
                    <input type="checkbox" name="skillset" style="height: 15px;width: 15px;" id=""><span>ReactJavscript</span>
                </td>
             </tr>
             <!-- Seventeenth row -->
              <tr>
                <td><input  type="submit" style="font-size: 25px;background-color: lightgray;border: none;outline: none;border-radius: 5px;"/></td>
                <td><input  type="reset" style="font-size: 25px;background-color: lightgray;border: none;outline: none;border-radius: 5px;"/></td>
              </tr>
        </tbody>
    </table>
    </form>   
</body>
</html>
