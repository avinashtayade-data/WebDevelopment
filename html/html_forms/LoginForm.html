<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginForm</title>
</head>
<body style="font-size: 20px;font-family: sans-serif;">
    <form action="https://www.facebook.comlogin" target="_blank">
        <!-- table inside form -->
         <table>
            <!-- html form table caption -->
            <caption style="font-size: 50px;font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;font-weight: bold;">LoginForm</caption>
            <!-- html form table body -->
            <tbody>
                <!-- html form table rows -->
                <!-- first row -->
                <tr>
                    <td><label for="username_inputbox">Username</label></td>
                    <td><input style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;" type="password" name="password" id="password_inputbox"></td>
                </tr>
                <!-- second row -->
                <tr>
                    <td><label for="password_inputbox">Password</label></td>
                    <td><input type="password" name="password" id="password_inputbox" style="font-size: 20px;border: none;outline: none;border-radius: 5px;background-color: lightgray;"></td>
                </tr>
                <!-- Third Row -->
                <tr>
                    <td colspan="2">
                        <a href="https://www.facebook.com/reg/?entry_point=login"></a>
                        <input type="submit" value="Login" style="font-size: 25px;border: none;outline: none;border-radius: 5px;background-color: lightgray;">
                        <a href="https://www.facebook.com/reg/?entry_point=login&next=" target="_blank"><input type="button" value="CreateAccount" style="font-size: 25px;border: none;outline: none;border-radius: 5px;background-color: lightgray;"></a>
                        <input type="reset" value="Cancel" style="font-size: 25px;border-radius: 5px;outline: none;border: none;background-color: lightgrey;">
                    </td>
                </tr>
            </tbody>
         </table>
    </form>
    
</body>
</html>
