<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Blocks Container</title>
</head>
<body>
    <!-- main container -->
    <div style="width: 100%;height:634px;font-size: 60px;font-family: sans-serif;font-size: 20px;">
     <div style="width: 100%;height:15%;background-color: peachpuff;text-align: center;">Header</div>

     <!-- Aside block conatiner -->

    <div style="width: 25%;height: 65%;float: left;background-color: lightgray;">
    <div style="width: 100%;height:50%;background-color: lightblue;">ASideOne</div>
    <div  style="width: 100%;height:50%;background-color: blue;">ASideTwo</div>
     </div>
     <div style="width: 75%;height: 65%;float: left;background-color: lightgrey;float: right;">
          <div style="width:25%;height: 33.33%;background-color: beige;float: left;">DOne</div>
          <div style="width:25%;height: 33.33%;background-color: palegoldenrod;float: left;">DTwo</div>
          <div style="width:25%;height: 33.33%;background-color: burlywood;float:left;">DThree</div>
          <div style="width:25%;height: 33.33%;background-color: brown;float: left;">DFour</div>
          <div style="width: 33.33%;height: 33.33%;background-color: orange;float: left;">Dfive</div>
          <div style="width: 33.33%;height: 33.33%;background-color: white;float: left;">DSix</div>
          <div style="width: 33.33%;height: 33.33%;background-color: green;float: left;">DSeven</div>
          <div style="width: 20%;height: 33.33%;background-color: green;float: left;">DEight</div>
          <div style="width: 20%;height: 33.33%;background-color: white;float: left;">DNine</div>
          <div style="width: 20%;height: 33.33%;background-color: red;float: left;">DTen</div>
          <div style="width: 20%;height: 33.33%;background-color: navy;float: left;">DEleven</div>
          <div style="width: 20%;height: 33.33%;background-color: lightgray;float: right;">DTwelve</div>
      </div>
    <!--foooter block  -->
    <div style="width: 100%;height:20%;color: white;background-color: rgb(20, 2, 2);float: right;text-align: center;">Footer</div>
    </div>
</body>
</html>
