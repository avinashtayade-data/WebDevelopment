<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Float Attribute Value</title>
</head>
<body>
    <!---first container-->
    <div style="width: 100px; height: 300px; float:left;">
        <div style="width: 100%;height: 33.3%;background-color: navy;"></div>
        <div style="width: 100%;height: 33.3%;background-color: lightgray;"></div>
        <div style="width: 100%;height: 33.3%;background-color: black;"></div>
        </div>
    </div>
    <!---second container-->
    <div style="width: 100px; height: 300px; float:right;">
        <div style="width: 100%;height: 33.3%;background-color: orange;"></div>
        <div style="width: 100%;height: 33.3%;background-color: white;"></div>
        <div style="width: 100%;height: 33.3%;background-color: green;"></div>
</body>
</html>
