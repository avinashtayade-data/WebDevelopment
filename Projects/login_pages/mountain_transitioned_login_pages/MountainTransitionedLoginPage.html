<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MountainTransitionedLoginPage</title>
    <link rel="stylesheet" href="MountainTransitionedLoginPage.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">   

</head>
<body>
    <div id="login_form_container">
        <div id="welcome_message_container">
            <h1 class="welcome_heading">Welcome Back</h1>
            <h1 class="welcome_heading" id="User_heading">User</h1>
        </div>
        <div id="login_form">
            <form action="" id="form">
              <input type="text" class="input_fields" placeholder="Username">
              <input type="password" class="input_fields" placeholder="Password">
              <button type="submit" id="button" >LOGIN</button>
              <fieldset id="OR_statement_fieldset">
                  <legend id="OR_statement_legend"  >OR</legend>
              </fieldset>
            </form>
            <span id="Sign_in_statement">Sign In With</span>
            <div id="social_media_icons_container">
             <i class="fa-brands fa-google social_media_icons   "  c id="google_icon"></i>
             <i class="fa-brands fa-facebook social_media_icons  "  c id="facebook_icon"></i>
             <i class="fa-brands fa-instagram social_media_icons  "  c id="instagram_icon"></i>
            </div>
        </div>
    </div>
</body>
</html>
