<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodGroupTable</title>
    <style>
        *{
        margin:0px;
        padding:0px;
        box-sizing:borderbox;
        font-family: ProductSans;
        text-align: center;
        font-weight: bold;

        }
        @font-face {
            font-family:ProductSans ;
            src: url(../../assets/fonts/ProductSansRegular.ttf);
        }
        #caption{
            font-weight: bold;
            font-size: 50px;
            color: white;
            background-color: red;
            border-radius: 15px 15px 0px 0px;
        }
        .column_headings{
            font-weight: bold;
            font-size: 30px;
            background-color: pink;
        }
        .odd_entries{
            background-color: lightgray;
        }
        .even_entries{
            background-color: pink;
        }
        #blood_group_table{
            margin: 30px;
        }
        #last_entry{
            border-radius:0px 0px 20px 20px;
        }
        .second_last_entry{
            border-radius:0px 0px 20px 0px;
        }
        
        .last_entry{
            border-radius:0px 0px 0px 20px;
        }
        .last_entries{
            border-radius:0px 0px 20px 0px;
            
        }
    </style>
    <script src="BloodGroupTable.js" defer></script>
</head>
<body>
<table id="blood_group_table">

</table>
</body>
</html>
