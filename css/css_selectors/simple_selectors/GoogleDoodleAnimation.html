<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoogleDoodleAnimation</title>
    <link rel="stylesheet" href="GoogleDoodleAnimation.css">
</head>
<body>

<center>
    <!-- <marquee behavior="alternate" direction="up" scrollamount="50">G</marquee> -->
   <div>
   <marquee behavior="alternate" direction="up" scrollamount="50" class="marko">
    <span id="G" class="google" >
        G
    </span>
   </marquee>
   <marquee behavior="alternate" direction="up" scrollamount="45" class="marko">
    <span id="O" class="google">
        o
    </span>
    </marquee>
    <marquee behavior="alternate" direction="up" scrollamount="40" class="marko">
    <span id="o" class="google">o</span>
    </marquee>
    <marquee behavior="alternate" direction="up"  scrollamount="35"  class="marko">
    <span id="g" class="google">g</span>
    </marquee>
    <marquee behavior="alternate" direction="up" scrollamount="30"   class="marko">
    <span id="l" class="google">l</span>
    </marquee>
    <marquee behavior="alternate" direction="up"  scrollamount="27" class="marko">
    <span id="e" class="google">e</span>
    </marquee>
  
   </div>
</center>

</body>
</html>
