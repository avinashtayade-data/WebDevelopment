<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple_selector</title>
    <link rel="stylesheet" href="SimpleSelectors.css">
</head>
<body>
   
    <span>CoreJava</span>
    <br>

    <span>CorePython</span>
    <br>

    <span>WebDevelopment</span>
    <br><br>

    <div>
        <button id="subscribe_button">Subscribe</button>
        <button id="follow_button">Follow</button>
    </div>

    <br>

    <div>
        <i class="navy_texts">ItalicsContent</i>

        <b class="navy_texts lightgray_background_color_texts">
            BoldedContent
        </b>

        <q class="navy_texts lightgray_background_color_texts">
            QuotationedContent
        </q>
    </div>

    <marquee behavior="" direction="" scrollamount="50">
        <q class="red_texts">ScrollableContent</q>
        <i class="red_texts">WebDevelopment</i>
        <b class="red_texts">JavaScript</b>
    </marquee>

</body>
</html>
    
</body>
</html>
