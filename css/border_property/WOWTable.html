<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOW Table</title>
    <link rel="stylesheet" href="WOWTable.css">
</head>
<body>
    <center>
        <table id="wow_table">
            <tbody id="wow_table_body">
                <!-- first row -->
                <tr class="wow_table_body_rows">
                    <td class="wow_table_body_cells empty_cells"></td>
                    <td class="wow_table_body_cells" id="w_one_cell">W</td>
                    <td class="wow_table_body_cells empty_cells"></td>
                </tr>
                <!-- second row -->
                <tr class="wow_table_body_rows">
                    <td class="wow_table_body_cells" id="w_two_cell">W</td>
                    <td class="wow_table_body_cells" id="o_cell">O</td>
                    <td class="wow_table_body_cells" id="w_three_cell">W</td>
                </tr>
                <!-- third row -->
                <tr class="wow_table_body_rows">
                    <td class="wow_table_body_cells empty_cells"></td>
                    <td class="wow_table_body_cells" id="w_four_cell">W</td>
                    <td class="wow_table_body_cells empty_cells"></td>
                </tr>
            </tbody>
        </table>
    </center>  
</body>
</html>
